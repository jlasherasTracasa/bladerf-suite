<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Trama FPGA</title><style>
:root{
  --bg:#FEF7FF; --card:#F3EDF7; --card2:#ECE6F0; --card3:#E6E0E9;
  --on:#1D1B20; --var:#49454F; --outline:#CAC4D0; --outlv:#E0D9E3;
  --pri:#6750A4; --onpri:#FFFFFF; --pric:#EADDFF; --onpric:#21005D;
  --sec:#625B71; --secc:#E8DEF8; --terc:#FFD8E4; --ter:#7D5260;
  --arrow:#6F6A78; --sh:.16; --ok:#26702B; --warn:#8A5700; --err:#B3261E;
  --w0:#F3EDF7; --w1:#E8DEF8; --w2:#D9C9F3; --w3:#C4B0EA; --w4:#A58BDB; --w5:#8467C8; --w6:#6750A4; --w7:#4F378B;
  --bc:#6A4FB3;
  --av:#0A6AA6;
  --mar:#08695B;
  --data:#8A5700;
  --ham:#B0286A;
  --spec:#26702B;
}

:root[data-theme=dark]{
  --bg:#141218; --card:#211F26; --card2:#2B2930; --card3:#36343B;
  --on:#E6E0E9; --var:#CAC4D0; --outline:#49454F; --outlv:#3A3741;
  --pri:#D0BCFF; --onpri:#381E72; --pric:#4F378B; --onpric:#EADDFF;
  --sec:#CCC2DC; --secc:#4A4458; --terc:#633B48; --ter:#EFB8C8;
  --arrow:#A29DAB; --sh:.5; --ok:#A6E3A1; --warn:#F7C873; --err:#F2B8B5;
  --w0:#1D1B20; --w1:#2B2336; --w2:#3A2D55; --w3:#4F378B; --w4:#6B4FB0; --w5:#8E6FD6; --w6:#B79CF5; --w7:#E8DDFF;
  --bc:#D0BCFF;
  --av:#8ECDF7;
  --mar:#7ED6C4;
  --data:#F7C873;
  --ham:#F2A7C3;
  --spec:#A6E3A1;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:'Inter','Inter Display',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
svg{display:block}
text{font-family:'Inter',system-ui,sans-serif;fill:var(--on)}
.disp{font-family:'Inter Display','Inter',sans-serif}
.mono{font-family:'DejaVu Sans Mono',ui-monospace,monospace}
.f-var{fill:var(--var)} .f-pri{fill:var(--pri)} .f-sec{fill:var(--sec)} .f-on{fill:var(--on)}
.f-ok{fill:var(--ok)} .f-warn{fill:var(--warn)} .f-err{fill:var(--err)} .f-onpri{fill:var(--onpri)} .f-onpric{fill:var(--onpric)}
.bg{fill:var(--bg)}
.card{fill:var(--card);stroke:var(--outlv);stroke-width:1}
.card2{fill:var(--card2);stroke:var(--outlv);stroke-width:1}
.card3{fill:var(--card3)}
.pri{fill:var(--pri)} .pric{fill:var(--pric)} .secc{fill:var(--secc)} .terc{fill:var(--terc)}
.ghost{fill:none;stroke:var(--outline);stroke-width:1.5;stroke-dasharray:5 5}
.line{stroke:var(--outline);stroke-width:1;fill:none}
.arr{stroke:var(--arrow);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.arr.pri{stroke:var(--pri);stroke-width:2.5}
.arr.dash{stroke-dasharray:6 6}
.arr.err{stroke:var(--err)}
.mk{fill:var(--arrow)} .mk-pri{fill:var(--pri)} .mk-err{fill:var(--err)}
.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sh{filter:url(#sh)}
.sh2{filter:url(#sh2)}
.lbl{fill:var(--bg);stroke:var(--outlv)}
.g-bc{--g:var(--bc)}
.g-av{--g:var(--av)}
.g-mar{--g:var(--mar)}
.g-data{--g:var(--data)}
.g-ham{--g:var(--ham)}
.g-spec{--g:var(--spec)}

.gt{fill:var(--g)} .gs{stroke:var(--g);fill:none}
.gtint{fill:color-mix(in srgb,var(--g) 17%,var(--card));stroke:color-mix(in srgb,var(--g) 45%,transparent);stroke-width:1.2}
.gsolid{fill:var(--g)}
.gdot{fill:var(--g)}
.w0{fill:var(--w0)}.w1{fill:var(--w1)}.w2{fill:var(--w2)}.w3{fill:var(--w3)}.w4{fill:var(--w4)}.w5{fill:var(--w5)}.w6{fill:var(--w6)}.w7{fill:var(--w7)}
</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1640" height="920" viewBox="0 0 1640 920"><defs><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#2a1a4a" style="flood-opacity:var(--sh)"/></filter><filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#2a1a4a" style="flood-opacity:calc(var(--sh)*.7)"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path class="mk" d="M1 1.5 8.5 5 1 8.5z" stroke-linejoin="round" stroke="var(--arrow)" stroke-width="1"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path class="mk-pri" d="M1 1.5 8.5 5 1 8.5z" stroke-linejoin="round" stroke="var(--pri)" stroke-width="1"/></marker><marker id="ahe" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path class="mk-err" d="M1 1.5 8.5 5 1 8.5z" stroke-linejoin="round" stroke="var(--err)" stroke-width="1"/></marker></defs><rect class="bg" width="1640" height="920"/><text class="disp" x="48" y="64" font-size="30" font-weight="600" letter-spacing="-0.4">Formato de la trama de espectro de la FPGA</text><text class="f-var" x="48" y="92" font-size="15">Palabras de 32 bit; en el flujo SC16 el host ve cada una como (I = bits 15:0, Q = bits 31:16). Sin marca de fin: se sincroniza por (w0, w1).</text><text class="disp" x="48.0" y="130.0" font-size="15" font-weight="600">Cabecera (8 palabras)</text><g class="g-bc"><rect class="gtint" x="50.0" y="146" width="158.5" height="110" rx="14"/></g><text class="mono" x="129.3" y="176.0" font-size="16" font-weight="700" text-anchor="middle">w0</text><text class="mono" x="129.3" y="206.0" font-size="11.5" font-weight="500" text-anchor="middle">0x4C415031</text><text class="f-var" x="129.3" y="230.0" font-size="10.5" font-weight="400" text-anchor="middle">«LAP1»</text><g class="g-bc"><rect class="gtint" x="212.5" y="146" width="158.5" height="110" rx="14"/></g><text class="mono" x="291.8" y="176.0" font-size="16" font-weight="700" text-anchor="middle">w1</text><text class="mono" x="291.8" y="206.0" font-size="11.5" font-weight="500" text-anchor="middle">0xB3BEAFCE</text><text class="f-var" x="291.8" y="230.0" font-size="10.5" font-weight="400" text-anchor="middle">~w0</text><g class="g-av"><rect class="gtint" x="375.1" y="146" width="158.5" height="110" rx="14"/></g><text class="mono" x="454.3" y="176.0" font-size="16" font-weight="700" text-anchor="middle">w2</text><text class="mono" x="454.3" y="206.0" font-size="10.5" font-weight="500" text-anchor="middle">[15:0] N · [31:16] K</text><text class="f-var" x="454.3" y="230.0" font-size="10.5" font-weight="400" text-anchor="middle"></text><g class="g-mar"><rect class="gtint" x="537.6" y="146" width="158.5" height="110" rx="14"/></g><text class="mono" x="616.8" y="176.0" font-size="16" font-weight="700" text-anchor="middle">w3</text><text class="mono" x="616.8" y="206.0" font-size="11.5" font-weight="500" text-anchor="middle">contador</text><text class="f-var" x="616.8" y="230.0" font-size="10.5" font-weight="400" text-anchor="middle">de trama</text><g class="g-ham"><rect class="gtint" x="700.1" y="146" width="158.5" height="110" rx="14"/></g><text class="mono" x="779.4" y="176.0" font-size="16" font-weight="700" text-anchor="middle">w4</text><text class="mono" x="779.4" y="206.0" font-size="11.5" font-weight="500" text-anchor="middle">índice bajo</text><text class="f-var" x="779.4" y="230.0" font-size="10.5" font-weight="400" text-anchor="middle">1.ª muestra</text><g class="g-ham"><rect class="gtint" x="862.6" y="146" width="158.5" height="110" rx="14"/></g><text class="mono" x="941.9" y="176.0" font-size="16" font-weight="700" text-anchor="middle">w5</text><text class="mono" x="941.9" y="206.0" font-size="11.5" font-weight="500" text-anchor="middle">índice alto</text><text class="f-var" x="941.9" y="230.0" font-size="10.5" font-weight="400" text-anchor="middle">avanza K·N</text><g class="g-data"><rect class="gtint" x="1025.2" y="146" width="158.5" height="110" rx="14"/></g><text class="mono" x="1104.4" y="176.0" font-size="16" font-weight="700" text-anchor="middle">w6</text><text class="mono" x="1104.4" y="206.0" font-size="11.5" font-weight="500" text-anchor="middle">[7:0] = 8</text><text class="f-var" x="1104.4" y="230.0" font-size="10.5" font-weight="400" text-anchor="middle">[15:8] = 1 · [16] pérdida</text><g class="g-spec"><rect class="gtint" x="1187.7" y="146" width="158.5" height="110" rx="14"/></g><text class="mono" x="1266.9" y="176.0" font-size="16" font-weight="700" text-anchor="middle">w7</text><text class="mono" x="1266.9" y="206.0" font-size="11.5" font-weight="500" text-anchor="middle">palabras</text><text class="f-var" x="1266.9" y="230.0" font-size="10.5" font-weight="400" text-anchor="middle">totales</text><rect class="ghost" x="1350.2" y="146" width="239.8" height="110" rx="14"/><text class="mono" x="1470.1" y="196.0" font-size="12.5" font-weight="600" text-anchor="middle">w8 … w8+N−1</text><text class="f-var" x="1470.1" y="220.0" font-size="12" font-weight="400" text-anchor="middle">potencias</text><text class="disp" x="48.0" y="316.0" font-size="15" font-weight="600">Cuerpo: N potencias en orden fftshift, y relleno hasta múltiplo de 2048 palabras (PAD = 1)</text><rect class="card sh2" x="48.0" y="330.0" width="1544.0" height="90.0" rx="18" /><text class="mono" x="78.0" y="370.0" font-size="13" font-weight="600">bin −N/2</text><text class="f-var" x="78.0" y="392.0" font-size="11.5" font-weight="400">−fs/2</text><text class="mono" x="378.0" y="370.0" font-size="13" font-weight="600">…</text><text class="mono" x="678.0" y="370.0" font-size="13" font-weight="600">bin 0</text><text class="f-var" x="678.0" y="392.0" font-size="11.5" font-weight="400">centro</text><text class="mono" x="978.0" y="370.0" font-size="13" font-weight="600">…</text><text class="mono" x="1278.0" y="370.0" font-size="13" font-weight="600">bin N/2−1</text><text class="disp" x="48.0" y="486.0" font-size="15" font-weight="600">Palabra de potencia {E[5:0], M[25:0]}</text><g class="g-spec"><rect class="gtint" x="48" y="500" width="289" height="64" rx="14"/></g><g class="g-av"><rect class="gtint" x="343" y="500" width="1248" height="64" rx="14"/></g><text class="mono" x="192.8" y="538.0" font-size="14" font-weight="600" text-anchor="middle">E  [31:26]</text><text class="mono" x="967.8" y="538.0" font-size="14" font-weight="600" text-anchor="middle">M  [25:0]  mantisa de 26 bit</text><text class="f-var" x="48.0" y="600.0" font-size="13" font-weight="400">valor = M · 2^E  ·  E = máx(0, msb(acc) − 25)  ·  rango de 2^64 con acumulación exacta de K tramas</text><rect class="card2 sh" x="48.0" y="660.0" width="1544.0" height="190.0" rx="24" /><circle class="pric" cx="89.0" cy="699.0" r="21.0"/><g transform="translate(78.5 688.5) scale(0.8750)" class="ico" style="color:var(--onpric);stroke-width:2"><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M8 6h8M16 14v4M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01"/></g><text class="disp" x="126.0" y="706.0" font-size="16" font-weight="600">De la palabra a dBFS</text><text class="mono" x="72.0" y="750.0" font-size="18" font-weight="500">dBFS[k] = 10·log10( 4·acc[k] / K ) − 20·log10( 2048 · Σw )</text><text class="f-var" x="72.0" y="784.0" font-size="12.5" font-weight="400">Σw = suma de la ventana Q15 (fpga_lab_window_sum(N)). Un tono de fondo de escala da 0 dBFS, como en src/dsp/spectrum.c.</text><text class="f-var" x="72.0" y="808.0" font-size="12.5" font-weight="400">Comprobado con el simulador del HDL: tono de amplitud 1000 → −6,47 dBFS (teórico −6,23); suelo de ruido −68,60 dBFS por bin (teórico −68,71).</text><text class="f-var" x="72.0" y="832.0" font-size="12.5" font-weight="400">Si llega un nuevo (w0, w1) antes de completar w7 palabras, la trama anterior se descarta.</text></svg><script>if(/[?&]dark/.test(location.search))document.documentElement.dataset.theme="dark";</script></body></html>
